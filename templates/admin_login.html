<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Lock Screen - Personality Analyzer">
    <title>Admin Authentication - Personality Analyzer</title>
    <!-- Modern Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="grid-bg"></div>
    <!-- Immersive looping ambient background video -->
    <div class="video-bg-container">
        <video autoplay loop muted playsinline class="video-bg">
            <source src="https://raw.githubusercontent.com/avinash201199/stopwatch/master/lofi.mp4" type="video/mp4">
        </video>
        <div class="video-bg-overlay"></div>
    </div>

    <div class="glow-orb" id="orb-left" style="background: rgba(255, 34, 34, 0.15);"></div>
    <div class="glow-orb" id="orb-right" style="background: rgba(255, 34, 34, 0.15);"></div>

    <main class="app-container">
        <section class="card admin-login-card fade-in">
            <header class="app-header">
                <div class="logo-badge" style="border-color: #ff2222; color: #ff4444;">RESTRICTED</div>
                <h1>System Authentication</h1>
                <p class="subtitle">Enter the security password to unlock the admin dashboard logs.</p>
            </header>

            {% if error %}
            <div class="error-alert-banner">
                <span class="error-icon">⚠️</span>
                <span class="error-msg-text">{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('admin_login') }}" method="POST" class="profile-form">
                <div class="form-group">
                    <label for="email-input">Admin Email Address</label>
                    <input type="email" name="email" id="email-input" placeholder="e.g. krati2510@gmail.com" required autocomplete="on" style="border-color: rgba(255, 34, 34, 0.25); margin-bottom: 12px;">
                </div>
                
                <div class="form-group">
                    <label for="password-input">Security Password</label>
                    <input type="password" name="password" id="password-input" placeholder="••••••••" required autocomplete="off" style="border-color: rgba(255, 34, 34, 0.25);">
                </div>

                <div class="action-bar" style="margin-top: 10px;">
                    <button type="submit" class="btn btn-primary btn-glow" style="background: #ff2222; color: #ffffff; box-shadow: 0 8px 25px rgba(255, 34, 34, 0.2);">
                        <span>Unlock Console</span>
                        <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 8px;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            </form>
            
            <div style="text-align: center; margin-top: 30px;">
                <a href="{{ url_for('index') }}" class="btn btn-secondary" style="font-size: 0.85rem; padding: 10px 20px; border-radius: 8px;">
                    <span>← Return to Quiz</span>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>Built with Python + Flask + Scikit-Learn (KNN Classifier)</p>
    </footer>

    <script>
        // Simple hover chimes binding
        const buttons = document.querySelectorAll(".btn, .sound-toggle-btn");
        buttons.forEach(btn => {
            btn.addEventListener("mouseenter", () => {
                if (typeof parent !== 'undefined' && parent.soundEffects) {
                    parent.soundEffects.hover();
                }
            });
        });
    </script>
</body>
</html>
